async function dbLoad(table) {
  const {
    data,
    error
  } = await sb.from(table).select('id, data');
  if (error) {
    throw new Error(`${table} 조회 실패: ${error.message}`);

}
async function dbSync(table, items) {
  const safeItems = Array.isArray(items) ? items : [];
  const {
    data: existing,
    error: selectError
  } = await sb.from(table).select('id');
  if (selectError) throw new Error(`${table} 기존 데이터 확인 실패: ${selectError.message}`);

  // 빈 배열이면 해당 테이블 데이터 전체 삭제
  if (safeItems.length === 0) {
    const {
      error
    } = await sb.from(table).delete().neq('id', '__none__');
    if (error) throw new Error(`${table} 초기화 실패: ${error.message}`);
    return;
  }
  const rows = safeItems.map(item => ({
    id: item.id,
    data: item,
    updated_at: new Date().toISOString()
  }));
  const {
    error
  } = await sb.from(table).upsert(rows, {
    onConflict: 'id'
  });
  if (error) throw new Error(`${table} 저장 실패: ${error.message}`);

  // 화면에서 삭제된 항목은 DB에서도 삭제한다.
  const currentIds = new Set(safeItems.map(item => item.id));
  const removedIds = (existing || []).map(row => row.id).filter(id => !currentIds.has(id));
  if (removedIds.length) {
    const {
      error: deleteError
    } = await sb.from(table).delete().in('id', removedIds);
    if (deleteError) throw new Error(`${table} 삭제 동기화 실패: ${deleteError.message}`);
  }
}
async function dbDelete(table, id) {
  const {
    error
  } = await sb.from(table).delete().eq('id', id);
  if (error) throw new Error(`${table} 삭제 실패: ${error.message}`);
}

    plans,
    matGroups
  };

}
