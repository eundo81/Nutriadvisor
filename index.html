  const needs = {};
  for (const pl of plans) {

    for (const ing of rcp.ings) {

    }
  }
  return needs;
}

async function dbLoad(table) {
  const {
    data,
    error
  } = await sb.from(table).select('id, data');
  if (error) {
    console.error('dbLoad', table, error);
    return [];
  }
  return data.map(r => r.data);
}
async function dbUpsert(table, items) {
  if (!items || items.length === 0) return;
  const rows = items.map(item => ({
    id: item.id,
    data: item,
    updated_at: new Date().toISOString()
  }));
  const {
    error
  } = await sb.from(table).upsert(rows, {
    onConflict: 'id'
  });
  if (error) console.error('dbUpsert', table, error);
}
async function dbDelete(table, id) {
  const {
    error
  } = await sb.from(table).delete().eq('id', id);

}

}
